          STORE_TEST_JKS: ${{ secrets.STORE_TEST_JKS }}

  publish-release:
    runs-on: ubuntu-latest
    needs: build-24
    if: ${{ needs.build-24.outputs.finished == 'true' }}
    permissions:
      contents: write
    steps:
      - name: Verify build finished
        run: echo "Build finished - publishing the Aerium x86_64 APK."
      - uses: actions/checkout@v5
        with:
          submodules: false
      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: aerium-android-x64
          path: release
      - name: Resolve version
        id: ver
        run: |
          V="$(cat release/version.txt 2>/dev/null || true)"
          [ -z "$V" ] && V="$(ls release/aerium-*-x86_64.apk | sed -E 's/.*aerium-([0-9.]+)-x86_64.*/\1/' | head -n1)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $V"
      - name: Compute checksum
        run: |
          set -euo pipefail
          cd release
          sha256sum aerium-*-x86_64.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Compose release notes
        id: notes
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          {
            echo "x86_64 build of Aerium $V, for emulators and x86 Android devices."
            echo
            echo "Most phones and tablets need the arm64-v8a build from the latest release instead."
            echo
          } > /tmp/notes.md
          awk -v v="$V" 'BEGIN{f=0} /^## /{ if (f) exit; if ($2 == v) { f=1; next } } f' \
            CHANGELOG.md >> /tmp/notes.md || true
          cat /tmp/notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          # -x64- in the tag so it can never collide with an arm64 tag, and the
          # build number so a release is never overwritten - same reasoning as
          # build.yml. The in-app updater cuts a tag at the first dash, so this
          # still reads as version $V to it.
          tag_name: v${{ steps.ver.outputs.version }}-x64-b${{ github.run_number }}
          name: Aerium ${{ steps.ver.outputs.version }} (x86_64, build ${{ github.run_number }})
          body_path: /tmp/notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Prerelease is load-bearing, not a label. The in-app updater asks
          # /releases/latest, and GitHub answers that with the newest release
          # that is neither a draft nor a prerelease. Publishing an x64 build
          # normally would make it "latest" and every arm64 user would be
          # offered an APK that will not install on their device.
          prerelease: true
          files: |
            release/aerium-*-x86_64.apk
            release/SHA256SUMS.txt

  check-completion:
    runs-on: ubuntu-latest
    needs: build-24
    if: ${{ always() }}
    steps:
      - name: Verify build finished
        run: |
          if [ "${{ needs.build-24.outputs.finished }}" != "true" ]; then
            echo "Build did not finish within 24 stages; dispatch this workflow again with resume_run_id set to this run to continue from the saved tree."
            exit 1
          fi
          echo "Build finished - APK is in the aerium-android-x64 artifact and published as a prerelease."
