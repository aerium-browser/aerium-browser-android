name: Build x64

# The same build as build.yml, for x86_64 devices - emulators, Chromebooks that
# run Android apps, and the handful of x86 tablets still in use. Asked for
# often enough to be worth having and not often enough to sit in front of the
# release build.
#
# Separate file rather than a matrix on build.yml, for one reason: a matrix
# would double every push. This build takes about seventeen hours across three
# to four stages of a twenty-four stage chain, the runner pool is shared, and
# arm64 is what almost everyone installs - so a routine commit must not put an
# x64 build in front of it. This one runs when someone asks for it.
#
# Everything that differs between the two lives in two places and nowhere else:
# the stage action's `arch` input (which picks the artifact namespace) and
# AERIUM_TARGET_CPU (which build.sh turns into target_cpu and the ABI name).
# The 24 stages, the checkpoint scheme, the timeouts and args.gn are shared.
#
# Not covered by auto-resume.yml, which watches the workflow named "Build". An
# x64 stage that dies needs a manual re-dispatch with resume_run_id - which is
# the right trade for a build nobody is waiting on, and easy to change later by
# adding this workflow's name to that trigger.

on:
  workflow_dispatch:
    inputs:
      fresh:
        description: 'Ignore the saved build tree and start from scratch'
        type: boolean
        required: false
        default: false
      resume_run_id:
        description: 'Resume from the build tree saved by this workflow run id (artifacts are per-run; a new run cannot see an old run''s tree without this)'
        type: string
        required: false
        default: ''

permissions:
  contents: write
  actions: write

# Its own group, so an x64 build and an arm64 build can run at the same time -
# they share no artifact name and no runner state. Within x64, the newest
# commit wins, matching build.yml: a run still compiling older sources cannot
# produce the APK anyone now wants.
concurrency:
  group: aerium-android-build-x64
  cancel-in-progress: true

jobs:
  build-1:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Stage 1
        id: stage
        uses: ./.github/actions/stage
        with:
          arch: x64
          finished: 'false'
          from_artifact: ${{ inputs.fresh == true && 'never' || 'auto' }}
          restore_run_id: ${{ inputs.resume_run_id || '' }}
        env:
          LOCAL_TEST_JKS: ${{ secrets.LOCAL_TEST_JKS }}
          STORE_TEST_JKS: ${{ secrets.STORE_TEST_JKS }}

  build-2:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    needs: build-1
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Stage 2
        id: stage
        uses: ./.github/actions/stage
        with:
          arch: x64
          finished: ${{ needs.build-1.outputs.finished }}
          from_artifact: 'auto'
        env:
          LOCAL_TEST_JKS: ${{ secrets.LOCAL_TEST_JKS }}
          STORE_TEST_JKS: ${{ secrets.STORE_TEST_JKS }}

  build-3:
    runs-on: ubuntu-latest
