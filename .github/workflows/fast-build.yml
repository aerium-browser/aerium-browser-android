name: Fast build (self-hosted Azure)

# On-demand self-hosted architecture: starts the Azure Linux VM (the same one
# aerium-browser-linux uses - both share the azure-linux-builder runner
# label), builds directly on its persistent disk, publishes a release, then
# deallocates the VM regardless of outcome. No --ci time-boxing here: the VM
# isn't subject to GitHub's per-job runner timeout, so build.sh runs to
# completion in one go; its own tree-reuse check (chromium/src/BUILD.gn
# already present) still makes repeat runs incremental.
#
# Setup required before this can run: see aerium-browser-linux's
# self-hosted-runner-setup.md guide (Azure OIDC app registration,
# least-privilege RBAC role, runner registration on the VM). Needs repo
# variables AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
# AZURE_RESOURCE_GROUP, AZURE_VM_NAME, and secrets LOCAL_TEST_JKS,
# STORE_TEST_JKS (same signing secrets the old build.yml used).

# Manual dispatch only - builds are triggered from GitHub (Actions tab),
# never automatically on push/commit. This keeps the VM from spinning up on
# every routine push; you decide when a build actually happens.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

concurrency:
  group: fast-build-android
  cancel-in-progress: false

jobs:
  start-vm:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: |
          az vm start --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name "${{ vars.AZURE_VM_NAME }}"

  build:
    needs: start-vm
    runs-on: [self-hosted, azure-linux-builder]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          # This VM's disk persists across runs - default clean=true would
          # git-clean the untracked build tree away on every checkout.
          clean: false

      - name: Build (unbounded - resumes incrementally via the persistent tree)
        run: |
          set -euo pipefail
          # D16as_v7 has 16 vCPUs / 64 GB RAM, well above the free runner's
          # 4 vCPU/16 GB that forced -j 2; give it more parallelism.
          export NINJA_JOBS=12
          bash build.sh
        env:
          LOCAL_TEST_JKS: ${{ secrets.LOCAL_TEST_JKS }}
          STORE_TEST_JKS: ${{ secrets.STORE_TEST_JKS }}

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          V="$(cat release/version.txt 2>/dev/null || true)"
          [ -z "$V" ] && V="$(ls release/aerium-*-arm64-v8a.apk | sed -E 's/.*aerium-([0-9.]+)-arm64.*/\1/' | head -n1)"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Compute checksum
        run: |
          set -euo pipefail
          cd release
          sha256sum aerium-*-arm64-v8a.apk > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}-b${{ github.run_number }}
          name: Aerium ${{ steps.ver.outputs.version }} (arm64)
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/aerium-*-arm64-v8a.apk
            release/SHA256SUMS.txt

  stop-vm:
    needs: [start-vm, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: |
          az vm deallocate --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name "${{ vars.AZURE_VM_NAME }}"
