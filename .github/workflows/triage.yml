name: triage

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write

concurrency:
  group: triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    if: ${{ !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) }}
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const LABEL = 'needs-info';
            const issue = context.payload.issue;
            const body = issue.body || '';

            const code = (body.match(/```[\s\S]*?```/g) || []).join(' ').trim();

            const prose = body
              .replace(/```[\s\S]*?```/g, ' ')
              .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ')
              .replace(/<img[^>]*>/gi, ' ')
              .replace(/https?:\/\/\S+/g, ' ')
              .replace(/^\s*###?#?\s.*$/gm, ' ')
              .replace(/[-*]\s*\[[xX ]\]/g, ' ')
              .replace(/_No response_/g, ' ')
              .replace(/\s+/g, ' ')
              .trim();

            const sufficient = prose.length >= 60 || code.length >= 120;
            const labels = (issue.labels || []).map(l => l.name);
            const flagged = labels.includes(LABEL);

            if (!sufficient && issue.state === 'open') {
              if (!flagged) {
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: issue.number,
                  body: [
                    'This was closed automatically because it does not contain enough to act on.',
                    '',
                    'A screenshot on its own is not a bug report. To reopen this, **edit the issue**',
                    'and include:',
                    '',
                    '- the Aerium version from Settings > About Aerium',
                    '- your device and Android version',
                    '- numbered steps to reproduce, from a fresh launch',
                    '- what you expected, and what happened instead',
                    '- for a crash, the `FATAL EXCEPTION` block from `adb logcat -d`',
                    '',
                    'It reopens by itself once the description is filled in.',
                  ].join('\n'),
                });
                await github.rest.issues.addLabels({
                  ...context.repo, issue_number: issue.number, labels: [LABEL],
                });
              }
              await github.rest.issues.update({
                ...context.repo, issue_number: issue.number,
                state: 'closed', state_reason: 'not_planned',
              });
              return;
            }

            if (sufficient && flagged) {
              await github.rest.issues.removeLabel({
                ...context.repo, issue_number: issue.number, name: LABEL,
              }).catch(() => {});
              if (issue.state === 'closed') {
                await github.rest.issues.update({
                  ...context.repo, issue_number: issue.number, state: 'open',
                });
              }
            }
