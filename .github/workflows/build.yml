name: Build
run-name: ${{ inputs.flavor == 'full' && (inputs.arch == 'x64' && 'Full build x64' || 'Full build') || (inputs.arch == 'x64' && 'Build x64' || '') }}

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
      - 'donate/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/triage.yml'
      - '.github/workflows/auto-resume.yml'
      - '.github/workflows/publish.yml'
      - '.github/workflows/upstream-watch.yml'
      - '.github/triage-rules.js'
  workflow_dispatch:
    inputs:
      fresh:
        description: 'Ignore the saved build tree and start from scratch'
        type: boolean
        required: false
        default: false
      resume_run_id:
        description: 'Resume from the build tree saved by this workflow run id'
        type: string
        required: false
        default: ''
      flavor:
        description: 'core builds the open core alone, full adds the private Aerium layer'
        type: choice
        options:
          - core
          - full
        default: core
      arch:
        description: 'arm64 for phones, x64 for emulators and Chromebooks'
        type: choice
        options:
          - arm64
          - x64
        default: arm64
      vm:
        description: 'Build in one go on the aerium machine'
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  actions: write

env:
  AERIUM_FLAVOR: ${{ inputs.flavor || 'core' }}
  AERIUM_UI_DIR: ${{ inputs.flavor == 'full' && format('{0}/ui', github.workspace) || '' }}
  AERIUM_APK_BASE: ${{ inputs.flavor == 'full' && 'aerium' || 'aerium-core' }}
  AERIUM_CHECKPOINT_KEY: ${{ inputs.flavor == 'full' && secrets.AERIUM_CHECKPOINT_KEY || '' }}

concurrency:
  group: ${{ inputs.flavor || 'core' }}-${{ inputs.arch || 'arm64' }}-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  vm:
    if: ${{ inputs.vm != false }}
    runs-on: self-hosted
    timeout-minutes: 2880
    steps:
      - name: Install base tools
        run: |
          echo 'DPkg::Lock::Timeout "1800";' | sudo tee /etc/apt/apt.conf.d/90aerium-wait >/dev/null
          sudo apt-get update -q
          sudo apt-get install -y -q git curl python3 lsb-release zstd openssl xz-utils file unzip
      - uses: actions/checkout@v5
        with:
          submodules: false
          clean: false
      - name: Check out the Aerium layer
        if: ${{ env.AERIUM_FLAVOR == 'full' }}
        uses: actions/checkout@v5
        with:
          repository: aerium-browser/aerium-browser-ui
          ssh-key: ${{ secrets.AERIUM_UI_KEY }}
          path: ui
          persist-credentials: false
      - name: Build
        env:
          AERIUM_TARGET_CPU: ${{ inputs.arch || 'arm64' }}
          NINJA_JOBS: '16'
          LOCAL_TEST_JKS: ${{ secrets.LOCAL_TEST_JKS }}
          STORE_TEST_JKS: ${{ secrets.STORE_TEST_JKS }}
        run: |
          cd "$GITHUB_WORKSPACE"
          rm -rf release stage-status chromium/src chromium/.gclient chromium/.gclient_entries chromium/.gclient_previous_sync_commits chromium/.cipd
          chmod +x ./*.sh
          df -h "$GITHUB_WORKSPACE"
          if [ -n "${AERIUM_UI_DIR:-}" ]; then
            set +e
            ./build.sh > vm-build.log 2>&1
            code=$?
            set -e
            if [ $code -ne 0 ]; then
              mkdir -p stage-status
              tail -n 3000 vm-build.log | zstd -q -T0 -19 \
                | openssl enc -aes-256-ctr -pbkdf2 -salt -pass env:AERIUM_CHECKPOINT_KEY \
                    -out stage-status/details.enc
              echo "build failed, the details are in the encrypted failure marker"
            fi
            rm -f vm-build.log
            exit $code
          fi
          ./build.sh
      - name: Upload failure marker
        if: ${{ failure() && env.AERIUM_FLAVOR == 'full' }}
        uses: actions/upload-artifact@v7
        with:
          name: build-error-aerium-${{ inputs.arch || 'arm64' }}
          path: ${{ github.workspace }}/stage-status/
          retention-days: 10
          overwrite: true
      - name: Upload final APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.AERIUM_FLAVOR == 'full' && 'aerium-full' || 'aerium-android' }}-${{ inputs.arch || 'arm64' }}
          path: ${{ github.workspace }}/release/
          retention-days: 30
          compression-level: 0
          overwrite: true

  build-1:
    if: ${{ inputs.vm == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
      deterministic: ${{ steps.stage.outputs.deterministic }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - name: Check out the Aerium layer
        if: ${{ env.AERIUM_FLAVOR == 'full' }}
        uses: actions/checkout@v5
        with:
          repository: aerium-browser/aerium-browser-ui
          ssh-key: ${{ secrets.AERIUM_UI_KEY }}
          path: ui
          persist-credentials: false
      - name: Stage 1
        id: stage
        uses: ./.github/actions/stage
        with:
          finished: 'false'
          from_artifact: ${{ inputs.fresh == true && 'never' || 'auto' }}
          restore_run_id: ${{ inputs.resume_run_id || '' }}
          arch: ${{ inputs.arch || 'arm64' }}
        env:
