name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'fastlane/**'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      fresh:
        description: 'Ignore the saved build tree and start from scratch'
        type: boolean
        required: false
        default: false
      resume_run_id:
        description: 'Resume from the build tree saved by this workflow run id (artifacts are per-run; a new run cannot see an old run''s tree without this)'
        type: string
        required: false
        default: ''

permissions:
  contents: write
  # The stage action retires the previous checkpoint artifact once the
  # replacement is stored - see .github/scripts/checkpoint-slot.sh - and both
  # listing and deleting artifacts need this. Without it the delete fails
  # harmlessly and the run simply keeps two checkpoints until they expire.
  actions: write

# Only the newest commit builds. A push supersedes whatever is in flight,
# because a build already compiling older sources cannot produce the APK anyone
# now wants - it would spend days to ship one that is wrong the moment it lands.
#
# This was false to stop routine pushes killing multi-day builds. What makes
# that safe to flip is the paths-ignore filter above rather than the flag
# itself: a CHANGELOG, README or fastlane push does not start a run here, so it
# cannot cancel one either. Superseding is only ever triggered by a commit that
# genuinely changes what would be compiled, and losing a build to one of those
# is not a loss - its output was already stale.
#
# auto-resume.yml already assumed this. Its cancelled-run branch checks whether
# the cancelled run's sha is still main's head and exits 0 when it is not,
# under the comment "only the newest commit builds"; the hourly schedule tick
# keys its checkpoint search on main's current HEAD for the same reason. Both
# have been waiting for this flag.
#
# Restricted to pushes, and that restriction is load-bearing. The only other
# thing that starts a build here is a workflow_dispatch, and auto-resume.yml
# sends one of those every time it decides a checkpoint is worth continuing. It
# guards against stacking by asking whether a run is already active - but that
# question is answered several API calls before the dispatch is actually made,
# so a push landing inside that window would be cancelled by the resume it
# raced. That trade is backwards twice over: it kills a build of the newest
# commit, and it replaces it with a run that restores an older commit's
# checkpoint tree. Making a dispatch queue instead, the way everything did
# before, costs nothing - a resume has no deadline - and leaves superseding to
# the one event that should do it.
concurrency:
  group: aerium-android-build
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build-1:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Stage 1
        id: stage
        uses: ./.github/actions/stage
        with:
          finished: 'false'
          from_artifact: ${{ inputs.fresh == true && 'never' || 'auto' }}
          restore_run_id: ${{ inputs.resume_run_id || '' }}
        env:
          LOCAL_TEST_JKS: ${{ secrets.LOCAL_TEST_JKS }}
          STORE_TEST_JKS: ${{ secrets.STORE_TEST_JKS }}

  build-2:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    needs: build-1
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Stage 2
        id: stage
        uses: ./.github/actions/stage
        with:
          finished: ${{ needs.build-1.outputs.finished }}
          from_artifact: 'auto'
        env:
          LOCAL_TEST_JKS: ${{ secrets.LOCAL_TEST_JKS }}
          STORE_TEST_JKS: ${{ secrets.STORE_TEST_JKS }}

