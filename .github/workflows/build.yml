          STORE_TEST_JKS: ${{ secrets.STORE_TEST_JKS }}

  publish-release:
    runs-on: ubuntu-latest
    needs: build-24
    if: ${{ needs.build-24.outputs.finished == 'true' }}
    permissions:
      contents: write
    steps:
      - name: Verify build finished
        run: echo "Build finished - publishing the Aerium APK."
      # Only for CHANGELOG.md. No submodules and no history: the release notes
      # come from a file in the tree, not from the git log, precisely so that
      # what users read is written for them rather than assembled from commit
      # subjects.
      - uses: actions/checkout@v5
        with:
          submodules: false
      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: aerium-android
          path: release
      - name: Resolve version
        id: ver
        run: |
          V="$(cat release/version.txt 2>/dev/null || true)"
          [ -z "$V" ] && V="$(ls release/aerium-*-arm64-v8a.apk | sed -E 's/.*aerium-([0-9.]+)-arm64.*/\1/' | head -n1)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $V"
      - name: Compute checksum
        run: |
          set -euo pipefail
          cd release
          sha256sum aerium-*-arm64-v8a.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # The section of CHANGELOG.md for this version, if it has one. Written in
      # plain language and kept in the tree so it is reviewed like any other
      # change; GitHub's generated commit list still follows underneath it for
      # anyone who wants the detail. A version with no section publishes with
      # just the generated list rather than failing the release.
      - name: Compose release notes
        id: notes
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          awk -v v="$V" 'BEGIN{f=0} /^## /{ if (f) exit; if ($2 == v) { f=1; next } } f' \
            CHANGELOG.md > /tmp/notes.md || true
          if [ -s /tmp/notes.md ]; then
            echo "Using the CHANGELOG.md section for $V:"
            cat /tmp/notes.md
          else
            echo "No CHANGELOG.md section for $V - publishing with generated notes only."
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # Prefer a PAT when one is configured: GITHUB_TOKEN's permissions
          # are capped by the enterprise/org/repo default and the workflow's
          # own `permissions: contents: write` cannot raise them past it,
          # which is currently blocking release creation in the Windows repo
          # with a 403. Falls back to GITHUB_TOKEN when the secret is absent,
          # so this stays inert until RELEASE_TOKEN exists.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          tag_name: v${{ steps.ver.outputs.version }}
          name: Aerium ${{ steps.ver.outputs.version }} (arm64)
          body_path: /tmp/notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/aerium-*-arm64-v8a.apk
            release/SHA256SUMS.txt

  check-completion:
    runs-on: ubuntu-latest
    needs: build-24
    if: ${{ always() }}
    steps:
      - name: Verify build finished
        run: |
          if [ "${{ needs.build-24.outputs.finished }}" != "true" ]; then
            echo "Build did not finish within 24 stages; dispatch the workflow again to continue from the saved tree."
            exit 1
          fi
          echo "Build finished - APK is in the aerium-android artifact and published as a release."
