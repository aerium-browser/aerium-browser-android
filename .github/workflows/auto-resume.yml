name: auto-resume

on:
  workflow_run:
    workflows: ['Build']
    types: [completed]
  schedule:
    - cron: '0 * * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: auto-resume
  cancel-in-progress: false

jobs:
  resume:
    if: >-
      github.event_name == 'schedule' ||
      ((github.event.workflow_run.conclusion == 'failure' ||
        github.event.workflow_run.conclusion == 'cancelled') &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Resume from the newest surviving checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: 'main'
          BUILD_WORKFLOW: 'build.yml'
          CHECKPOINT_PATTERN: 'build-artifact-android(-arm64)?(-b)?'
          ERROR_MARKER_PATTERN: 'build-error-android(-arm64)?'
          PROGRESS_JOB_PATTERN: ''
          ATTEMPT_CAP: '5'
        run: |
          set -euo pipefail

          RUNS="repos/$REPO/actions/workflows/$BUILD_WORKFLOW/runs"

          live_artifact_names() {
            gh api "repos/$REPO/actions/runs/$1/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired == false) | .name' 2>/dev/null || true
          }

          holds_checkpoint() {
            live_artifact_names "$1" | grep -qxE "$CHECKPOINT_PATTERN"
          }

          holds_error_marker() {
            [ -n "$ERROR_MARKER_PATTERN" ] || return 1
            live_artifact_names "$1" | grep -qxE "$ERROR_MARKER_PATTERN"
          }

          compiled_something() {
            [ -n "$PROGRESS_JOB_PATTERN" ] || return 0
            local finished
            finished=$(gh api "repos/$REPO/actions/runs/$1/jobs?per_page=100" \
              | jq --arg part "$PROGRESS_JOB_PATTERN" \
                  '[.jobs[] | select(.conclusion == "success" or .conclusion == "cancelled")
                            | select(.name | contains($part))] | length')
            [ "$finished" -gt 0 ]
          }

          stall_already_reported() {
            [ "$EVENT" = schedule ] || return 1
            local last_alarm newest_run
            last_alarm=$(gh api \
              "repos/$REPO/actions/workflows/auto-resume.yml/runs?branch=$BRANCH&status=failure&per_page=1" \
              --jq '.workflow_runs[0].created_at // empty' 2>/dev/null || true)
            newest_run=$(jq -r '[.workflow_runs[].created_at] | sort | reverse | .[0] // empty' <<<"$runs_json")
            [ -n "$last_alarm" ] && [ -n "$newest_run" ] && [[ "$last_alarm" > "$newest_run" ]]
          }

          stall() {
            echo "$1"
            if stall_already_reported; then
              echo "This stall is already red in the Actions list - not raising it a second time."
              exit 0
            fi
            exit 1
          }

          active=0
          for attempt in 1 2; do
            if [ "$attempt" -eq 2 ]; then
              echo "Nothing active yet - looking again in 30s in case a build is still registering."
              sleep 30
            fi
            active=$(gh api "$RUNS?branch=$BRANCH&per_page=30" \
              --jq '[.workflow_runs[] | select(.status != "completed")] | length')
            if [ "$active" -gt 0 ]; then
              break
            fi
          done
          if [ "$active" -gt 0 ]; then
            echo "A build is still active - nothing to resume."
            exit 0
          fi

          BRANCH_SHA=$(gh api "repos/$REPO/commits/$BRANCH" --jq '.sha')
          if [ "$EVENT" = schedule ]; then
            HEAD_SHA="$BRANCH_SHA"
          else
            HEAD_SHA="$EVENT_HEAD_SHA"
            if [ "$HEAD_SHA" != "$BRANCH_SHA" ]; then
              echo "$BRANCH is now $BRANCH_SHA - that run was superseded, not interrupted."
              exit 0
            fi
          fi

          echo "Looking for a resumable checkpoint for $HEAD_SHA"
          runs_json=$(gh api "$RUNS?head_sha=$HEAD_SHA&per_page=50")

          if [ "$(jq '.workflow_runs | length' <<<"$runs_json")" -eq 0 ]; then
            echo "No build has run for $HEAD_SHA - nothing to resume."
            exit 0
          fi

          if [ "$(jq '[.workflow_runs[] | select(.conclusion == "success")] | length' <<<"$runs_json")" -gt 0 ]; then
            echo "$HEAD_SHA has already built successfully - nothing to resume."
            exit 0
          fi

          newest_failed=$(jq -r '[.workflow_runs[] | select(.conclusion == "failure")]
                                 | sort_by(.run_number) | reverse | .[0].id // empty' <<<"$runs_json")
          if [ -n "$newest_failed" ] && holds_error_marker "$newest_failed"; then
            {
              echo "## Build needs a human, not a resume"
              echo
              echo "Run \`$newest_failed\` for \`$HEAD_SHA\` failed deterministically -"
              echo "a compile error, a gn/patch failure, or a missing build output."
              echo "Resuming would rebuild to the same point and fail the same way."
              echo
              echo "The failure marker artifact on that run has the exit code."
            } >> "$GITHUB_STEP_SUMMARY"
            stall "Newest failure for $HEAD_SHA is deterministic - not resuming."
          fi

          RUN_ID=""
          for candidate in $(jq -r '[.workflow_runs[] | select(.conclusion == "failure" or .conclusion == "cancelled")]
                                    | sort_by(.run_number) | reverse | .[].id' <<<"$runs_json"); do
            if ! holds_checkpoint "$candidate"; then
              echo "  run $candidate has no surviving checkpoint - looking further back"
              continue
            fi
            if ! compiled_something "$candidate"; then
              echo "  run $candidate checkpointed a prepared tree with nothing compiled in it - looking further back"
              continue
            fi
            RUN_ID="$candidate"
            break
          done

          if [ -z "$RUN_ID" ]; then
            {
              echo "## Build stalled with nothing to resume"
              echo
              echo "No run for \`$HEAD_SHA\` left a checkpoint that is still alive and"
              echo "holds compiled output, so there is no tree to continue from. This"
              echo "usually means the failure happened in source setup, before the"
              echo "first checkpoint."
              echo
              echo "Dispatch the build manually to start it over."
            } >> "$GITHUB_STEP_SUMMARY"
            stall "No surviving checkpoint for $HEAD_SHA - a fresh build is needed."
          fi

          attempts=$(jq '[.workflow_runs[] | select(.actor.login == "github-actions[bot]")] | length' <<<"$runs_json")
          if [ "$attempts" -ge "$ATTEMPT_CAP" ]; then
            {
              echo "## Auto-resume cap reached"
              echo
              echo "\`$HEAD_SHA\` has been auto-resumed $attempts times without"
              echo "finishing. Something is wrong that resuming does not fix."
            } >> "$GITHUB_STEP_SUMMARY"
            stall "Already auto-resumed $attempts times for $HEAD_SHA - giving up, this needs a human."
          fi

          echo "Dispatching resume of run $RUN_ID (auto-attempt $((attempts + 1)))"
          gh api -X POST "repos/$REPO/actions/workflows/$BUILD_WORKFLOW/dispatches" \
            -f ref="$BRANCH" -f "inputs[resume_run_id]=$RUN_ID"
