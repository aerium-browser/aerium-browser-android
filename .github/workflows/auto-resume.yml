name: auto-resume
# When a build fails AND left a checkpoint behind, re-dispatch it with
# resume_run_id so it continues without a human noticing. This covers two
# distinct cases here:
#   1. transient runner deaths (e.g. run 29987438454's "runner lost
#      communication with the server" at stage 11)
#   2. the by-design "did not finish within 24 stages" failure from
#      check-completion, which previously required a manual re-dispatch to
#      keep a long build going
# The cap is higher than the Windows repo's because case 2 means one commit
# can legitimately need several auto-continues.
#
# What it deliberately does NOT cover is a failure that will reproduce. The
# stage uploads a build-error-android marker whenever build.sh returned
# non-zero, and by that point non-zero can only mean a compile error, a gn gen
# error, or a FATAL from the source-setup substitutions - build.sh turns the
# ordinary "out of time budget" case into exit 0 first, and a runner death
# never reaches the upload at all. So the marker separates "died on the way"
# from "cannot succeed", and only the former is resumed.
#
# All three dead ends - deterministic failure, no surviving checkpoint, cap
# reached - now fail this job rather than exiting green. Exiting green is what
# let run 80 die in source setup and leave Android idle for 13.5 hours while
# an hourly tick wrote "nothing to resume" into a log nobody was reading. A
# red auto-resume run is the alarm, and it stops on its own once a build for a
# newer commit runs.
#
# Resuming is scoped to the commit main currently points at, and to runs that
# still hold a live checkpoint. Both halves matter:
#
#   - A run with no artifacts is not proof the commit is broken, only that
#     that run died before packing one. This used to be read the other way -
#     "latest run saved no checkpoint -> real error, do not resume" - which
#     wedged the chain completely: run 31552439778 died as a runner-agent
#     death with zero artifacts, stayed the newest run precisely because
#     nothing would resume it, and the guard then fired hourly and refused
#     122 times in a row. So the search walks back to the newest run that
#     did leave a tree instead of stopping at the first that did not.
#
#   - A build tree is only valid for the commit that produced it. Keying on
#     main's current HEAD rather than "the newest failed run" keeps a resume
#     from carrying a checkpoint built from different sources, which matters
#     most exactly when it would be hardest to spot: Android has just moved a
#     whole Chromium milestone, and a stale tree would compile the wrong
#     thing rather than fail loudly.
#
# The hourly schedule exists because workflow_run is not enough on its own:
# GitHub deliberately does not emit workflow_run events for runs dispatched
# with GITHUB_TOKEN, and every auto-resume dispatch is exactly that. So the
# workflow_run trigger only ever fires for the first failure after a human
# starts a build, and the chain used to die silently one run later - run
# 30824853126 failed on Aug 6 and nothing restarted it. The schedule polls
# instead of relying on an event that will never arrive.
on:
  workflow_run:
    workflows: [Build]
    types: [completed]
  schedule:
    - cron: '0 * * * *'

permissions:
  actions: write

jobs:
  resume:
    if: >-
      github.event_name == 'schedule' ||
      ((github.event.workflow_run.conclusion == 'failure' ||
        github.event.workflow_run.conclusion == 'cancelled') &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Resume from the newest surviving checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          RUNS="repos/$REPO/actions/workflows/build.yml/runs"

          # Never stack a second build on a live one. Any run that is not yet
          # completed means the chain is still healthy.
          active=$(gh api "$RUNS?branch=main&per_page=30" \
            --jq '[.workflow_runs[] | select(.status != "completed")] | length')
          if [ "$active" -gt 0 ]; then
            echo "A build is still active - nothing to resume."
            exit 0
          fi

          # Which commit are we trying to finish? For workflow_run it is the run
          # that just failed; on a schedule tick it is whatever main points at
          # now. Deriving it from main rather than from "the newest run" is what
          # stops a resume carrying a checkpoint built from different sources:
          # a build tree is only valid for the commit that produced it, and
          # Android has just moved a whole Chromium milestone, so a stale tree
          # would compile the wrong thing rather than fail cleanly.
          if [ "$EVENT" = "schedule" ]; then
            HEAD_SHA=$(gh api "repos/$REPO/commits/main" --jq '.sha')
          else
            HEAD_SHA="$EVENT_HEAD_SHA"
          fi
          # Cancelled counts as stopped, not just failed - the Windows repo lost
          # nine hours of finished work to a cancellation nobody made, because a
          # cancelled run reports conclusion 'cancelled' and this job only
          # matched 'failure', so its checkpoint went unread.
          #
          # One kind of cancellation must NOT be resumed: superseding an
          # in-flight build by pushing a newer commit. Resuming that would fight
          # the rule that only the newest commit builds. The other routine case
          # - killing a duplicate run on the same commit - is already handled by
          # the active-run check above, which refuses to stack on a live build.
          #
          # Exit 0, not 1: declining to resume a build someone cancelled on
          # purpose is this job working, and marking it red would put a failure
          # in the Actions list every time a superseded run is killed.
          if [ "$EVENT" != "schedule" ] && [ "$CONCLUSION" = cancelled ]; then
            main_sha=$(gh api "repos/$REPO/commits/main" --jq '.sha')
            if [ "$main_sha" != "$HEAD_SHA" ]; then
              echo "main is now $main_sha - that run was superseded, not interrupted."
              exit 0
            fi
            echo "Run cancelled with nothing replacing it - treating as an interruption."
          fi

          echo "Looking for a resumable checkpoint for $HEAD_SHA"

          runs_json=$(gh api "$RUNS?head_sha=$HEAD_SHA&per_page=50")

          if [ "$(jq '[.workflow_runs[] | select(.conclusion == "success")] | length' <<<"$runs_json")" -gt 0 ]; then
            echo "$HEAD_SHA has already built successfully - nothing to resume."
            exit 0
          fi

          # Walk the failed runs for this commit newest-first and take the first
          # one that still has a checkpoint.
          #
          # This is the deadlock fix. The old rule was "latest run saved no
          # checkpoint -> real error, do not resume", applied to the single most
          # recent run. Run 31552439778 died as a runner-agent death and
          # produced zero artifacts, so it looked like a real error forever -
          # and because it stayed the most recent run precisely because nothing
          # would resume it, the chain wedged. That guard fired hourly and took
          # the same branch 122 times.
          #
          # A run with no artifacts is not evidence of a broken commit; it is
          # evidence that that particular run died before it could pack one.
          # The question worth asking is whether ANY run for this commit left a
          # tree behind, so ask that instead. Artifacts expire (10 days), so
          # expired ones are skipped rather than dispatched into a download
          # failure.
          # Before looking for anything to resume, ask whether the newest
          # failure is one that CAN be resumed. The stage uploads a
          # build-error-android marker whenever build.sh returned non-zero,
          # which by then can only mean a failure that reproduces - build.sh
          # converts the ordinary "out of time budget" case to exit 0 before
          # returning. A runner death or job timeout never gets far enough to
          # upload it.
          #
          # Resuming a deterministic failure recompiles up to the same broken
          # target and dies in the same place, and the only thing it spends is
          # the retry cap. Run 81 failed on a GPC redefinition and was resumed
          # five times, each attempt burning hours to reach the identical
          # compile error, until the cap stopped it. The commit needed a code
          # change; no number of retries was ever going to supply one.
          newest_failed=$(jq -r '[.workflow_runs[] | select(.conclusion == "failure")]
                                 | sort_by(.run_number) | reverse | .[0].id // empty' <<<"$runs_json")
          if [ -n "$newest_failed" ] \
             && gh api "repos/$REPO/actions/runs/$newest_failed/artifacts" \
                  --jq '.artifacts[] | select(.expired == false) | .name' 2>/dev/null \
                | grep -qx 'build-error-android'; then
            {
              echo "## Build needs a human, not a resume"
              echo
              echo "Run \`$newest_failed\` for \`$HEAD_SHA\` failed with a deterministic"
              echo "error - a compile failure, a gn gen failure, or a FATAL from the"
              echo "source-setup substitutions. Resuming would reproduce it."
              echo
              echo "Download the \`build-error-android\` artifact from that run for the"
              echo "exit code and failed targets, fix the cause, and push. The next"
              echo "build starts from the new commit."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Newest failure for $HEAD_SHA is deterministic - not resuming."
            exit 1
          fi

          RUN_ID=""
          for candidate in $(jq -r '[.workflow_runs[] | select(.conclusion == "failure" or .conclusion == "cancelled")]
                                    | sort_by(.run_number) | reverse | .[].id' <<<"$runs_json"); do
            if gh api "repos/$REPO/actions/runs/$candidate/artifacts" \
                 --jq '.artifacts[] | select(.expired == false) | .name' 2>/dev/null \
               | grep -qx 'build-artifact-android'; then
              RUN_ID="$candidate"
              break
            fi
            echo "  run $candidate has no surviving checkpoint - looking further back"
          done

          if [ -z "$RUN_ID" ]; then
            # Exiting green here is what let Android sit idle for 13.5 hours:
            # run 80 died in source setup, so it never packed a checkpoint,
            # this branch printed a line into a log nobody reads, and the
            # hourly tick did the same thing every hour until someone looked.
            # A build that is stuck is worth a red mark in the Actions list -
            # it clears itself as soon as a build for a newer commit runs.
            {
              echo "## Build stalled with nothing to resume"
              echo
              echo "No run for \`$HEAD_SHA\` left a checkpoint that is still alive,"
              echo "so there is no tree to continue from. This usually means the"
              echo "failure happened in source setup, before the first pack."
              echo
              echo "Dispatch Build manually to start it over."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "No surviving checkpoint for $HEAD_SHA - a fresh build is needed."
            exit 1
          fi

          # Cap the auto-retry chain per commit. Dispatches made with the
          # workflow token show actor github-actions[bot], so manual resumes by
          # a human do not count against the cap.
          attempts=$(jq '[.workflow_runs[] | select(.actor.login == "github-actions[bot]")] | length' <<<"$runs_json")
          if [ "$attempts" -ge 5 ]; then
            {
              echo "## Auto-resume cap reached"
              echo
              echo "\`$HEAD_SHA\` has been auto-resumed $attempts times without"
              echo "finishing. Something is wrong that resuming does not fix."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Already auto-resumed $attempts times for $HEAD_SHA - giving up, this needs a human."
            exit 1
          fi

          echo "Dispatching resume of run $RUN_ID (auto-attempt $((attempts + 1)))"
          gh api -X POST "repos/$REPO/actions/workflows/build.yml/dispatches" \
            -f ref=main -f "inputs[resume_run_id]=$RUN_ID"
