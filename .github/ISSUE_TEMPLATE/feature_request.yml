name: Feature request
description: Suggest something Aerium should do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **A bot reads this before a human does.** A request with nothing in it gets
        closed automatically, and closed requests that nobody fills in are deleted
        eventually. Say enough that someone can judge the idea.

        Aerium stays lightweight. If an extension or a user script can already do
        it, that beats a patch somebody has to carry across every Chromium release
        for years.

        And this is a spare-time project. A request here is a suggestion, never an
        order. Suggestions get read. Orders get closed.

  - type: checkboxes
    id: checklist
    attributes:
      label: Before requesting
      options:
        - label: An extension or user script cannot already do this.
          required: true
        - label: I searched this tracker and this is not already requested.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you hit, not the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What should Aerium do?
    validations:
      required: true

  - type: input
    id: prior-art
    attributes:
      label: Does another browser do this?
      description: Naming one that already does it makes this much easier to judge.
      placeholder: "Brave does X; Cromite has flag Y"
    validations:
      required: false
